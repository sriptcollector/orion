<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>Life in Years</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      max-width: 340px;
      width: 100%;
    }

    .dot {
      aspect-ratio: 1;
      border-radius: 50%;
      background: #1a1a1a;
      transition: background 0.3s ease;
    }

    .dot.lived {
      background: #e0e0e0;
    }

    .dot.current {
      background: #e0e0e0;
      box-shadow: 0 0 8px rgba(224, 224, 224, 0.4);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 8px rgba(224, 224, 224, 0.4); }
      50% { box-shadow: 0 0 16px rgba(224, 224, 224, 0.7); }
    }

    .stats {
      margin-top: 32px;
      display: flex;
      gap: 32px;
      font-size: 13px;
      color: #444;
      letter-spacing: 0.05em;
    }

    .stats span {
      color: #888;
    }
  </style>
</head>
<body>

  <h1>Life in Years</h1>
  <div class="grid" id="grid"></div>
  <div class="stats">
    <div><span id="lived">17</span> lived</div>
    <div><span id="left">83</span> left</div>
  </div>

  <script>
    const AGE = 17;
    const LIFESPAN = 100;
    const grid = document.getElementById('grid');

    for (let i = 0; i < LIFESPAN; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i < AGE - 1) {
        dot.classList.add('lived');
      } else if (i === AGE - 1) {
        dot.classList.add('current');
      }
      grid.appendChild(dot);
    }

    document.getElementById('lived').textContent = AGE;
    document.getElementById('left').textContent = LIFESPAN - AGE;
  </script>

</body>
</html>
